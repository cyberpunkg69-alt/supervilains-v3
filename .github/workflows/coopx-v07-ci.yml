name: COOP X Cinema v0.7 smoke tests
on:
  push:
    branches: [coopx-cinema-v07-stage]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install multimedia dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-fra
          python -m pip install --upgrade pip
          python -m pip install -r coopx-vision/requirements.txt
      - name: Python syntax
        run: python -m py_compile coopx-vision/*.py
      - name: Test clips, transitions and soundtrack
        run: python coopx-vision/test_v07.py
