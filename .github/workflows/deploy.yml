name: Deployer SUPERVILAINS V3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Rendre les GIFs disponibles si archive presente
        shell: bash
        run: |
          if [ -f SUPERVILAINS_12_GIFS_REACTIONS.zip ]; then
            mkdir -p assets/reactions
            unzip -oqj SUPERVILAINS_12_GIFS_REACTIONS.zip -d assets/reactions
            echo "Les 12 GIFs sont extraits pour le site."
          fi
      - name: Preparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
